[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-dicom"
version = "0.1.0"
description = "Lumi DICOM Orchestrator — DICOM Modality Worklist orchestrator for radiology workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lumi DICOM", email = "dev@lumi-dicom.local"}
]
keywords = ["dicom", "mwl", "modality-worklist", "radiology", "orchestrator", "mpps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydicom>=3.0.0,<4.0.0",
    "pynetdicom>=2.0.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "pyinstaller>=6.0",
]

[project.scripts]
lumi-dicom = "lumi_dicom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lumi_dicom*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
